<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>旅行计划</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap">
<link rel="stylesheet" href="plan.css?v=2">
</head>
<body class="trip">
<canvas class="snow" id="snow" aria-hidden="true"></canvas>
<main class="wrap">
  <header class="top">
    <a class="back" href="trips.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span>全部旅行</span>
    </a>
    <div class="who" id="who" role="group" aria-label="我是谁"></div>
  </header>

  <div id="body">
    <section class="hero">
      <p class="kicker" id="h-kicker">&nbsp;</p>
      <h1 id="h-title">…</h1>
      <p class="sub" id="h-sub"></p>
      <ul class="route" id="h-route" aria-label="路线" hidden></ul>
      <button class="btn editbtn" id="h-edit" type="button" hidden>改一改这次旅行</button>
    </section>

    <form class="tripform" id="meta-form" autocomplete="off" hidden></form>

    <section class="count" aria-live="polite">
      <div class="what" id="c-what">&nbsp;</div>
      <div class="big" id="c-big">…</div>
      <div class="flights" id="c-flights"></div>
    </section>

    <p class="banner" id="banner" hidden></p>

    <div class="seg tabs" id="tabs" role="group" aria-label="切换">
      <button type="button" data-tab="plan" aria-pressed="true">每日行程</button>
      <button type="button" data-tab="lists" aria-pressed="false">清单</button>
    </div>

    <section id="tab-plan">
      <ol class="days" id="days" aria-label="每日行程"></ol>
      <p class="foot" id="foot-plan"></p>
    </section>

    <section id="tab-lists" hidden>
      <div class="lists" id="lists"></div>
      <p class="foot">打勾、加东西，两边都会马上同步。自己加的事项可以点 × 删掉。</p>
    </section>
  </div>

  <div class="empty gone" id="gone" hidden>
    <p>找不到这次旅行，可能已经删掉了。</p>
    <a class="btn main" href="trips.html">回到全部旅行</a>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=1794930658"></script>
<script src="tripcore.js?v=1"></script>
<script src="trip.js?v=2"></script>
</body>
</html>
