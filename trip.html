<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>多伦多 10 日游</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap">
<link rel="stylesheet" href="plan.css?v=1">
</head>
<body class="trip">
<canvas class="snow" id="snow" aria-hidden="true"></canvas>
<main class="wrap">
  <header class="top">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span>首页</span>
    </a>
    <div class="who" id="who" role="group" aria-label="我是谁"></div>
  </header>

  <section class="hero">
    <p class="kicker">TORONTO · 2026.12.19 – 12.29</p>
    <h1>多伦多 10 日游</h1>
    <p class="sub">11 天 10 晚 · 27 个地点 · 我们两个人的冬天</p>
    <ul class="route" aria-label="路线">
      <li>皮尔地区</li><li>多伦多</li><li>哈密尔顿</li><li>尼亚加拉</li><li>约克地区</li><li>安大略湖</li>
    </ul>
  </section>

  <section class="count" aria-live="polite">
    <div class="what" id="c-what">茄子萌落地还有</div>
    <div class="big" id="c-big">…</div>
    <div class="flights">
      <span>落地 <b>12.19 周六 15:56</b> 皮尔逊机场</span>
      <span>起飞 <b>12.29 周二 12:55</b> 皮尔逊机场</span>
    </div>
  </section>

  <p class="banner" id="banner" hidden></p>

  <div class="seg tabs" id="tabs" role="group" aria-label="切换">
    <button type="button" data-tab="plan" aria-pressed="true">每日行程</button>
    <button type="button" data-tab="lists" aria-pressed="false">清单</button>
  </div>

  <section id="tab-plan">
    <ol class="days" id="days" aria-label="每日行程"></ol>
    <p class="foot">行程来自圆周旅迹（行程口令 IRYM）。到了一个地方就点左边的圈打个卡，两边都能看到。</p>
  </section>

  <section id="tab-lists" hidden>
    <div class="lists" id="lists"></div>
    <p class="foot">打勾、加东西，两边都会马上同步。自己加的事项可以点 × 删掉。</p>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=1794930658"></script>
<script src="trip.js?v=1"></script>
</body>
</html>
