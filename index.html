<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>我们的小世界</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&display=swap">
<link rel="stylesheet" href="home.css?v=1794889774">
</head>
<body>
<div class="sky" aria-hidden="true"><canvas id="stars"></canvas></div>
<main class="wrap">
  <header class="head">
    <span class="egg" aria-hidden="true"></span>
    <div>
      <h1>我们的小世界</h1>
      <p id="names"><b>Logan</b> &amp; <b>茄子萌</b></p>
    </div>
  </header>
  <section class="cards" aria-label="这里有的东西">
    <a class="card cd" href="countdown.html">
      <div class="deco flip" aria-hidden="true"><span id="d1">1</span><span id="d2">1</span><span id="d3">1</span></div>
      <span class="no">01</span>
      <h2 id="cd-title">小茄子的时间表</h2>
      <ul class="lines" id="cd-lines"><li>打开看看</li></ul>
      <span class="go">打开倒计时</span>
    </a>
    <a class="card" href="earth.html">
      <div class="deco globe" aria-hidden="true"></div>
      <span class="no">02</span>
      <h2>我们的地球</h2>
      <ul class="lines" id="earth-lines"><li>一起去过的地方，都记在这里</li></ul>
      <span class="go">打开地球</span>
    </a>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="home.js?v=1794889774"></script>
</body>
</html>
