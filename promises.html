<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>我们的承诺本</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap">
<link rel="stylesheet" href="plan.css?v=1">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span>首页</span>
    </a>
    <div class="who" id="who" role="group" aria-label="我是谁"></div>
  </header>

  <section class="intro">
    <p class="kicker">OUR PROMISE BOOK</p>
    <h1>我们的承诺本</h1>
    <p class="lede">说过的话写下来，两个人都拉过钩，就算数了。做到了，就盖一个章。</p>
  </section>

  <p class="banner" id="banner" hidden></p>

  <section class="stats" aria-label="统计">
    <div class="stat"><b id="n-all">0</b><span>写下的承诺</span></div>
    <div class="stat"><b id="n-wait">0</b><span>等着兑现</span></div>
    <div class="stat"><b id="n-done">0</b><span>已经兑现</span></div>
  </section>

  <form class="write" id="write" autocomplete="off">
    <textarea id="w-text" maxlength="500" placeholder="写下一个承诺……" aria-label="承诺内容"></textarea>
    <div class="row">
      <span class="lab">谁答应的</span>
      <div class="seg" id="w-who" role="group" aria-label="谁答应的"></div>
    </div>
    <input id="w-due" maxlength="60" placeholder="什么时候兑现（可以不填，比如：12 月见面的时候）" aria-label="什么时候兑现">
    <div class="row end"><button class="btn main" id="w-go" type="submit" disabled>写进承诺本</button></div>
  </form>

  <div class="filter">
    <div class="seg" id="filter" role="group" aria-label="筛选">
      <button type="button" data-f="all" aria-pressed="true">全部</button>
      <button type="button" data-f="wait" aria-pressed="false">等着兑现</button>
      <button type="button" data-f="done" aria-pressed="false">已兑现</button>
    </div>
    <span class="n" id="f-n"></span>
  </div>
  <ol class="slips" id="slips" aria-label="承诺"></ol>
  <p class="foot">写下的、拉钩的、盖章的，两边都能马上看到。只有写下这条承诺的人能删掉它。</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=1794930658"></script>
<script src="promises.js?v=1"></script>
</body>
</html>
