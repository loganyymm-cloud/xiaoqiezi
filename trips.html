<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>我们的旅行</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap">
<link rel="stylesheet" href="plan.css?v=3">
</head>
<body class="trip">
<main class="wrap">
  <header class="top">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span>首页</span>
    </a>
    <div class="who" id="who" role="group" aria-label="我是谁"></div>
  </header>

  <section class="intro">
    <p class="kicker">OUR TRIPS</p>
    <h1>我们的旅行</h1>
    <p class="lede">每一次一起出发，都记在这里：去哪、哪天、每天去哪儿、要带什么。</p>
  </section>

  <p class="banner" id="banner" hidden></p>

  <div class="stats" id="stats"></div>

  <ol class="trips" id="trips" aria-label="全部旅行"></ol>

  <section class="newtrip">
    <button class="btn main" id="new-open" type="button">+ 规划一次新的旅行</button>
    <form class="tripform" id="new" autocomplete="off" hidden>
      <h2>新的旅行</h2>
      <label class="fld"><span>名字</span><input id="n-title" maxlength="40" placeholder="比如：春天去京都"></label>
      <label class="fld"><span>去哪</span><input id="n-place" maxlength="40" placeholder="目的地，比如：京都"></label>
      <div class="two">
        <label class="fld"><span>出发</span><input id="n-start" type="date"></label>
        <label class="fld"><span>回来</span><input id="n-end" type="date"></label>
      </div>
      <label class="fld"><span>一句话</span><input id="n-sub" maxlength="60" placeholder="可不填，比如：第一次一起看樱花"></label>
      <div class="acts">
        <button class="btn" id="new-cancel" type="button">先不了</button>
        <button class="btn main" type="submit">建好，开始排</button>
      </div>
    </form>
  </section>

  <section class="passport book" id="book" aria-label="印章本"></section>

  <p class="foot">建好以后点进去，就能一天一天加地点、起名字、列清单，在「航班 · 印章」里记航班号和里程。两边都能改，都会马上同步。</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=1794930658"></script>
<script src="tripcore.js?v=1"></script>
<script src="flights.js?v=1"></script>
<script src="trips.js?v=2"></script>
</body>
</html>
